name: admosa_signage_app
description: Panel de gestión ADMOSA SignageTV para móvil (WebView del panel web).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3   # 6.1.5 rompe con AGP nuevo (proguard); la beta lo corrige
  shared_preferences: ^2.3.2        # Para guardar la URL del servidor

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
