name: Build APK

# Compila el APK en la nube (Linux) — evita el bloqueo de AF_UNIX de la máquina corporativa.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencias
        run: flutter pub get

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: admosa-signage-apk
          path: build/app/outputs/flutter-apk/app-release.apk
